[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-multimodal-ecommerce"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "opensearch-py>=2.6",
    "gremlinpython>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
